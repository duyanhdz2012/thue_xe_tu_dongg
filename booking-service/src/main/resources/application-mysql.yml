spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/car_rental?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:car_rental}
    password: ${DB_PASSWORD:car_rental}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
