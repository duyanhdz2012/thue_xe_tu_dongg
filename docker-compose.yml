services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: car_rental
      MYSQL_USER: car_rental
      MYSQL_PASSWORD: car_rental
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - car_rental_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  car_rental_mysql:
