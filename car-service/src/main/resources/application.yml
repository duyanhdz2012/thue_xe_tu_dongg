spring:
  application:
    name: car-service
  datasource:
    url: jdbc:h2:mem:carrental;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8082
app:
  jwt:
    secret: ${JWT_SECRET:car-rental-modular-monolith-secret-key-must-be-at-least-32-bytes}
    expiration-minutes: 480
  sepay:
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
